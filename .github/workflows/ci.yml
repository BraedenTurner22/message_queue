name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # vcpkg caches built ports here; actions/cache saves it between runs so
  # dependencies (gRPC especially, later) are not rebuilt on every push.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
  CC: clang-18
  CXX: clang++-18

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up vcpkg (pinned to builtin-baseline if present)
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          baseline=$(jq -r '."builtin-baseline" // empty' vcpkg.json)
          if [ -n "$baseline" ]; then git -C "$VCPKG_ROOT" checkout "$baseline"; fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-clang18-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-clang18-

      # Ubuntu 24.04 runners use high mmap ASLR entropy, which makes TSan abort
      # with "unexpected memory mapping". Lowering it is the standard workaround.
      - name: Relax ASLR for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          files=$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc')
          [ -z "$files" ] || clang-format-18 --dry-run --Werror $files
